plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id("org.jetbrains.intellij.platform") version "2.14.0"
}

// 配置 Gradle 缓存策略
configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

// 配置 JVM 参数以避免 Java agent 问题
tasks.withType(JavaExec) {
    jvmArgs = ['-Xmx2048m']
    systemProperty 'java.awt.headless', 'false'
}

group 'cn.pk5454754'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
compileJava {
    options.release = 17   // 生成与 Java 17 兼容的字节码
}
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
//    mavenCentral()
    maven {
        url 'https://maven.aliyun.com/nexus/content/repositories/google'
    }
    maven {
        url 'https://maven.aliyun.com/nexus/content/groups/public/'
    }
    maven {
        url 'https://maven.aliyun.com/nexus/content/repositories/jcenter'
    }
    maven { url 'https://packages.jetbrains.team/maven/p/ij/intellij-dependencies' }
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'

    // 3. 定义 IntelliJ Platform 依赖
    intellijPlatform {
        // 创建对 IntelliJ IDEA 社区版 (IC) 的依赖，版本为 2024.2.6
        intellijIdea('2026.1')
        // 声明对 'java' 插件的依赖
        bundledPlugin('com.intellij.java')
    }
}

// 4. 在 intellijPlatform 扩展中配置插件元数据
intellijPlatform {
    pluginConfiguration {
        // 插件名称
        name = "Patcher2026"
        // 插件版本
        version = "1.1.0" //
        // 插件描述
        description = "IntelliJ-based IDE plugin that exports incremental patch files.一款导出增量补丁文件的IDEA插件"

        // 开发者信息
        vendor {
            name = "Pk5454754"
            email = "pk5454754@qq.com"
            url = "https://github.com/pk5454754/Patcher2026"
        }

        // 更新日志
        changeNotes = """
              Version update content:
              <ul>
                <li>2026.01.02 Fixed the issue where running the IDEA version later than 2025.1 would result in an error and prevent the export of class files.</li>
              </ul>
              <hr/>
              版本更新内容：
              <ul>
                <li>2026.01.02 修复idea的2025.1版本以上运行报错，无法导出class文件问题。</li>
                <li>2026.01.06 修复线程安全问题，修复 "Read access is allowed from inside read-action only" 错误</li>
                <li>2026.05.05 升级kotlin版本为2.2.21，升级gradle版本为9.4.1，使用Kotlin替代JAVA即将弃用的API  ReadAction.compute/ReadAction.run</li>
              </ul>
        """.stripIndent()
        ideaVersion {
            // 5. 手动指定版本范围，实现 updateSinceUntilBuild = false 的效果
            sinceBuild = '261'
            untilBuild = null
        }
    }
}


// 配置 runIde 任务以避免 Java agent 问题
tasks.named('runIde') {
    maxHeapSize = '2048m'
    jvmArgs = ['-Xmx2048m', '-Didea.cycle.buffer.size=disabled']
}
tasks.buildPlugin {
    // 构建插件任务会自动处理结构
}

